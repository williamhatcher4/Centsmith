[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centsmith"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1,!=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "sqlalchemy>=2.0.50",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "starlette>=1.1.0",
    "httpx>=0.27",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "xlwt>=1.3",
]
packaging = [
    "pyinstaller>=6.6",
    "pyarmor>=9.0",
]
audit = [
    "pip-audit>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage gate ratcheted to actual-5 (P5.2, 2026-06-12): measured 92.67% ->
# fail-under 87. Re-ratchet to actual-5 after any item that adds a meaningful
# test batch; never lower the gate to merge -- shrink the change or add tests.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=87"
markers = [
    "perf: slow performance/load tests over a synthetic large-ledger fixture",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrations/versions/*",
    "app/config.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
