<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centsmith</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0d12;
        color: #e6e8ee;
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .title { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
      .hint { font-size: 0.9rem; opacity: 0.6; }
      .spinner {
        width: 28px; height: 28px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #7aa2ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="spinner"></div>
      <div class="title">Starting Centsmith…</div>
      <div class="hint">Loading local server</div>
    </div>
  </body>
</html>
