name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (tests + coverage + audit)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "backend[dev,audit]"

      - name: Backend tests + coverage
        working-directory: backend
        run: python -m pytest

      - name: Backend audit
        working-directory: backend
        run: python -m pip_audit

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tests + build + audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit + component tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend audit
        working-directory: frontend
        run: npm run audit

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  desktop:
    name: Desktop (cargo check + test + audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Stage placeholder Tauri resources
        working-directory: desktop/src-tauri
        run: |
          mkdir -p resources/backend
          touch resources/backend/.gitkeep

      - name: Desktop check
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Desktop tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Desktop audit
        working-directory: desktop/src-tauri
        run: cargo audit

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "backend[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install e2e harness
        working-directory: e2e
        run: npm ci || npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, desktop, e2e]
    if: always()
    steps:
      - name: Verify all required jobs passed
        shell: bash
        run: |
          set -e
          backend='${{ needs.backend.result }}'
          frontend='${{ needs.frontend.result }}'
          desktop='${{ needs.desktop.result }}'
          e2e='${{ needs.e2e.result }}'
          echo "backend=$backend frontend=$frontend desktop=$desktop e2e=$e2e"
          for r in "$backend" "$frontend" "$desktop" "$e2e"; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not pass ($r)" && exit 1
            fi
          done
