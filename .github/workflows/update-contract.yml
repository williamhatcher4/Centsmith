name: Update feed contract

# Live contract test for the public auto-update feed (plan item P5.3).
# The feed lives in the separate Centsmith_website repo; a regression there
# silently breaks the updater for every installed app. The red workflow badge is
# the alert channel — no extra notification plumbing.

on:
  schedule:
    # Weekly, Mondays 14:00 UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPDATER_BASE_URL: https://centsmith.ca/api/updates

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run update feed contract test
        shell: pwsh
        run: |
          & .\packaging\update-contract-test.ps1 -BaseUrl "${{ env.UPDATER_BASE_URL }}"
