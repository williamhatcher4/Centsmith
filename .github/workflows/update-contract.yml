name: Update Worker contract

# Live contract test for the license-gated auto-update Worker (plan item P5.3).
# The Worker lives in the separate Centsmith_website repo; a regression there
# silently breaks the updater for every installed app. The red workflow badge is
# the alert channel — no extra notification plumbing.

on:
  schedule:
    # Weekly, Mondays 14:00 UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPDATER_BASE_URL: https://centsmith.ca/api/updates

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run update Worker contract test
        shell: pwsh
        env:
          CENTSMITH_TEST_LICENSE: ${{ secrets.CENTSMITH_TEST_LICENSE }}
        run: |
          $params = @{ BaseUrl = "${{ env.UPDATER_BASE_URL }}" }
          if (-not [string]::IsNullOrWhiteSpace($env:CENTSMITH_TEST_LICENSE)) {
            $params.License = $env:CENTSMITH_TEST_LICENSE
            Write-Host "::notice::Running full contract (rejection + licensed manifest) checks."
          } else {
            Write-Host "::notice::CENTSMITH_TEST_LICENSE not set; running rejection-only checks (steps 1-3)."
          }
          & .\packaging\update-contract-test.ps1 @params
