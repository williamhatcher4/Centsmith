name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
  R2_BUCKET: centsmith-installers
  R2_PREFIX: installers
  # Base URL of the license-gated update Worker (in the Centsmith_website repo).
  # The app's updater endpoint in tauri.conf.json must match this base + /latest.json.
  UPDATER_BASE_URL: https://centsmith.ca/api/updates

jobs:
  ci-gate:
    name: CI gate (full suite)
    uses: ./.github/workflows/ci.yml

  release-windows:
    needs: ci-gate
    runs-on: windows-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $version = $tag.TrimStart('v')
          $changelog = Get-Content -Raw -LiteralPath "CHANGELOG.md"
          $escaped = [regex]::Escape($version)
          # Body between "## [x.y.z] ..." and the next "## " heading (or EOF).
          $rx = "(?ms)^##\s*\[$escaped\][^\n]*\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($changelog, $rx)
          if (-not $m.Success -or [string]::IsNullOrWhiteSpace($m.Groups[1].Value)) {
            throw "No CHANGELOG.md section found for version $version. Add a '## [$version]' entry before tagging."
          }
          $notes = $m.Groups[1].Value.Trim()
          $notesPath = Join-Path $env:RUNNER_TEMP "centsmith-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate Cloudflare release credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            throw "CLOUDFLARE_API_TOKEN secret is missing. Add a Cloudflare API token that can write R2 objects to the centsmith-installers bucket."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw "CLOUDFLARE_ACCOUNT_ID secret is missing. Add the Cloudflare account id that owns the centsmith-installers R2 bucket."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create backend venv
        run: python -m venv backend\.venv

      - name: Install backend dependencies
        run: |
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          backend\.venv\Scripts\python.exe -m pip install -e "backend[dev,audit,packaging]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Decode Windows signing certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "WINDOWS_CERTIFICATE_BASE64 secret is not configured; Windows Authenticode signing will be skipped."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "centsmith-code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sync tauri.conf.json version to release tag
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "RELEASE_TAG must look like v0.1.1, got $tag"
          }
          $version = $Matches[1]
          $confPath = "desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content -Raw -LiteralPath $confPath | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $confPath -Encoding utf8

      - name: Build obfuscated backend resources
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: .\packaging\build.ps1 -SkipTauri -ObfuscateBackend

      - name: Verify Windows signing command
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PATH: ${{ env.WINDOWS_CERTIFICATE_PATH }}
        run: |
          $backendExe = Get-ChildItem -Path "desktop\src-tauri\resources\backend" -Recurse -Filter "*.exe" |
            Select-Object -First 1
          if (-not $backendExe) {
            throw "No staged backend executable found to verify the signing command."
          }
          & "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File ".\packaging\sign-windows.ps1" `
            -FilePath $backendExe.FullName

      - name: Build Tauri release bundle
        shell: pwsh
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PATH: ${{ env.WINDOWS_CERTIFICATE_PATH }}
        run: cargo tauri build

      - name: Upload paid release artifacts to private R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $notes = Get-Content -Raw -LiteralPath $env:RELEASE_NOTES_PATH
          $bundleDir = "desktop\src-tauri\target\release\bundle\nsis"
          $installer = Get-ChildItem -LiteralPath $bundleDir -Filter "*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer .exe found in $bundleDir"
          }

          $tag = "${{ env.RELEASE_TAG }}"
          $objectKey = "${{ env.R2_PREFIX }}/$($installer.Name)"
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          $latestPath = Join-Path $env:RUNNER_TEMP "centsmith-latest.json"
          $releasePath = Join-Path $env:RUNNER_TEMP "centsmith-release.json"
          $existingReleasesPath = Join-Path $env:RUNNER_TEMP "centsmith-releases-existing.json"
          $mergedReleasesPath = Join-Path $env:RUNNER_TEMP "centsmith-releases.json"

          function Invoke-Wrangler([string[]]$Arguments) {
            & npx --yes wrangler@latest @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "wrangler $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          $metadata = [ordered]@{
            release_tag = $tag
            object_key = $objectKey
            filename = $installer.Name
            size_bytes = $installer.Length
            sha256 = $sha256
            published_at = $publishedAt
            notes = $notes
          }

          $metadata | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $latestPath -Encoding utf8
          $metadata | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $releasePath -Encoding utf8

          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/$objectKey", "--file=$($installer.FullName)", "--content-type", "application/vnd.microsoft.portable-executable", "--remote")
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/latest.json", "--file=$latestPath", "--content-type", "application/json", "--remote")
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/releases/$tag.json", "--file=$releasePath", "--content-type", "application/json", "--remote")

          # --- Tauri updater manifest (the app's auto-update feed; served by the
          # license-gated Worker). Distinct from latest.json, which feeds the
          # website download page. The `url` points back at the Worker's gated
          # download route, so the installer fetch is authorized too.
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) {
            throw "Updater signature not found at $sigPath. Ensure createUpdaterArtifacts is enabled and TAURI_SIGNING_PRIVATE_KEY is set."
          }
          $signature = (Get-Content -Raw -LiteralPath $sigPath).Trim()
          $version = $tag.TrimStart('v')
          $updaterPath = Join-Path $env:RUNNER_TEMP "centsmith-updater.json"
          $updater = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $publishedAt
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "$($env:UPDATER_BASE_URL)/download/$($installer.Name)"
              }
            }
          }
          $updater | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $updaterPath -Encoding utf8
          # Fail the release if the manifest doesn't match the Tauri updater
          # schema — a malformed feed would brick auto-update for every install.
          & .\packaging\validate-release-artifacts.ps1 -UpdaterJsonPath $updaterPath
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/updater.json", "--file=$updaterPath", "--content-type", "application/json", "--remote")

          $releases = @()
          & npx --yes wrangler@latest r2 object get "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/releases.json" "--file=$existingReleasesPath" "--remote"
          if ($LASTEXITCODE -eq 0 -and (Test-Path $existingReleasesPath)) {
            $existing = Get-Content -Raw -LiteralPath $existingReleasesPath | ConvertFrom-Json
            if ($existing -is [array]) {
              $releases = @($existing)
            } elseif ($null -ne $existing) {
              $releases = @($existing)
            }
          }

          $releases = @($metadata) + @($releases | Where-Object { $_.release_tag -ne $tag })
          $trimmedReleases = @($releases | Select-Object -First 20)
          ConvertTo-Json -InputObject $trimmedReleases -Depth 8 -AsArray | Set-Content -LiteralPath $mergedReleasesPath -Encoding utf8
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/releases.json", "--file=$mergedReleasesPath", "--content-type", "application/json", "--remote")

          # Hand the version + installer hash to the published-feed contract check.
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify published update feed serves this release (P5.3)
        shell: pwsh
        env:
          CENTSMITH_TEST_LICENSE: ${{ secrets.CENTSMITH_TEST_LICENSE }}
        run: |
          # Prove the just-published feed serves the new version and the exact
          # installer bytes through the licensed gate. With the secret absent, run
          # rejection-only checks and warn (a missing secret must not block releases).
          $params = @{ BaseUrl = "${{ env.UPDATER_BASE_URL }}" }
          if (-not [string]::IsNullOrWhiteSpace($env:CENTSMITH_TEST_LICENSE)) {
            $params.License = $env:CENTSMITH_TEST_LICENSE
            $params.ExpectedVersion = $env:RELEASE_VERSION
            $params.ExpectedInstallerSha256 = $env:INSTALLER_SHA256
          } else {
            Write-Host "::warning::CENTSMITH_TEST_LICENSE not set; running rejection-only contract checks (steps 1-3)."
          }
          & .\packaging\update-contract-test.ps1 @params

      - name: Installer smoke test (install, launch, health probe, uninstall)
        shell: pwsh
        run: .\packaging\installer-smoke-test.ps1
