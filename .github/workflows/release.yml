name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read
  # SignPath's connector reads this run's job details and downloads the
  # unsigned artifacts with the workflow token.
  actions: read

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
  R2_BUCKET: centsmith-installers
  R2_PREFIX: installers
  # Authenticode signing via SignPath (free OSS certificate from SignPath
  # Foundation). The organization id is a repository variable; the slugs
  # default to the names in PROJECT_OVERVIEW.md's signing setup.
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'centsmith' }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
  # Base URL of the public update feed (in the Centsmith_website repo).
  # The app's updater endpoint in tauri.conf.json must match this base + /latest.json.
  UPDATER_BASE_URL: https://centsmith.ca/api/updates

jobs:
  ci-gate:
    name: CI gate (full suite)
    uses: ./.github/workflows/ci.yml

  release-windows:
    needs: ci-gate
    runs-on: windows-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $version = $tag.TrimStart('v')
          $changelog = Get-Content -Raw -LiteralPath "CHANGELOG.md"
          $escaped = [regex]::Escape($version)
          # Body between "## [x.y.z] ..." and the next "## " heading (or EOF).
          $rx = "(?ms)^##\s*\[$escaped\][^\n]*\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($changelog, $rx)
          if (-not $m.Success -or [string]::IsNullOrWhiteSpace($m.Groups[1].Value)) {
            throw "No CHANGELOG.md section found for version $version. Add a '## [$version]' entry before tagging."
          }
          $notes = $m.Groups[1].Value.Trim()
          $notesPath = Join-Path $env:RUNNER_TEMP "centsmith-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate Cloudflare release credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            throw "CLOUDFLARE_API_TOKEN secret is missing. Add a Cloudflare API token that can write R2 objects to the centsmith-installers bucket."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw "CLOUDFLARE_ACCOUNT_ID secret is missing. Add the Cloudflare account id that owns the centsmith-installers R2 bucket."
          }

      - name: Validate SignPath signing configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          # Releases are always signed: Smart App Control blocks unsigned builds,
          # so a missing signing setup must fail here, before anything is built
          # or published, rather than ship an installer that won't start.
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "SIGNPATH_API_TOKEN secret is missing. Add a SignPath API token for a submitter on the Centsmith project (see PROJECT_OVERVIEW.md, Code signing)."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            throw "SIGNPATH_ORGANIZATION_ID repository variable is missing. Add your SignPath organization id (see PROJECT_OVERVIEW.md, Code signing)."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create backend venv
        run: python -m venv backend\.venv

      - name: Install backend dependencies
        run: |
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          backend\.venv\Scripts\python.exe -m pip install -e "backend[dev,audit,packaging]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Sync tauri.conf.json version to release tag
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "RELEASE_TAG must look like v0.1.1, got $tag"
          }
          $version = $Matches[1]
          $confPath = "desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content -Raw -LiteralPath $confPath | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $confPath -Encoding utf8
          # x.y.z without the "v", for SignPath's version parameter and the
          # updater signature.
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build backend resources
        run: .\packaging\build.ps1 -SkipTauri

      # --- Signing ---------------------------------------------------------------
      # Smart App Control only runs binaries that are signed (or already known to
      # Microsoft). SignPath signs remotely and every request waits for a manual
      # approval in SignPath, so signing can't run inside `cargo tauri build`.
      # Instead: build the shell exe without bundling, sign it together with the
      # backend exe, bundle the installer from those signed files, then sign the
      # installer. That's two approvals per release.

      - name: Build Tauri app executable (no installer yet)
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri build --no-bundle failed" }

      - name: Stage app binaries for signing
        shell: pwsh
        run: |
          # Layout must match packaging/signpath/app-binaries.xml.
          $stage = Join-Path $env:RUNNER_TEMP "signpath-app-unsigned"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "backend") | Out-Null
          Copy-Item -LiteralPath "desktop\src-tauri\target\release\centsmith.exe" -Destination $stage
          Copy-Item -LiteralPath "desktop\src-tauri\resources\backend\centsmith-backend.exe" -Destination (Join-Path $stage "backend")

      - name: Upload unsigned app binaries
        id: upload-unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-binaries
          path: ${{ runner.temp }}/signpath-app-unsigned
          if-no-files-found: error
          retention-days: 1

      - name: Sign app binaries (SignPath; approve in SignPath)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-binaries
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves an hour to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath-app-signed
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}

      - name: Put signed app binaries back in place
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP "signpath-app-signed"
          Copy-Item -Force -LiteralPath (Join-Path $signed "centsmith.exe") -Destination "desktop\src-tauri\target\release\centsmith.exe"
          Copy-Item -Force -LiteralPath (Join-Path $signed "backend\centsmith-backend.exe") -Destination "desktop\src-tauri\resources\backend\centsmith-backend.exe"
          & .\packaging\verify-authenticode.ps1 -Path @(
            "desktop\src-tauri\target\release\centsmith.exe",
            "desktop\src-tauri\resources\backend\centsmith-backend.exe"
          )

      - name: Bundle NSIS installer from the signed binaries
        shell: pwsh
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # --no-binary-patching: bundling otherwise rewrites centsmith.exe in
          # place with bundle-type info, which would break the signature just
          # applied. Centsmith ships a single bundle type (NSIS), so the updater
          # uses the generic windows-x86_64 manifest entry and loses nothing.
          cargo tauri bundle --bundles nsis --no-binary-patching
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri bundle failed" }
          & ..\..\packaging\verify-authenticode.ps1 -Path "target\release\centsmith.exe"

      - name: Stage installer for signing
        shell: pwsh
        run: |
          $bundleDir = "desktop\src-tauri\target\release\bundle\nsis"
          $expected = "Centsmith_$($env:APP_VERSION)_x64-setup.exe"
          $installer = Join-Path $bundleDir $expected
          if (-not (Test-Path -LiteralPath $installer)) {
            $found = (Get-ChildItem -LiteralPath $bundleDir -Filter "*.exe" | ForEach-Object Name) -join ", "
            throw "Expected installer $expected in $bundleDir (packaging/signpath/installer.xml matches this name); found: $found"
          }
          $stage = Join-Path $env:RUNNER_TEMP "signpath-installer-unsigned"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer -Destination $stage

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: ${{ runner.temp }}/signpath-installer-unsigned
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (SignPath; approve in SignPath)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath-installer-signed
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}

      - name: Put signed installer back and re-sign updater artifact
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $name = "Centsmith_$($env:APP_VERSION)_x64-setup.exe"
          $installer = Join-Path "desktop\src-tauri\target\release\bundle\nsis" $name
          Copy-Item -Force -LiteralPath (Join-Path $env:RUNNER_TEMP "signpath-installer-signed\$name") -Destination $installer
          & .\packaging\verify-authenticode.ps1 -Path $installer

          # The updater .sig from bundling covers the unsigned installer bytes;
          # Authenticode signing changed them, so sign the final file again.
          $sigPath = "$installer.sig"
          Remove-Item -LiteralPath $sigPath -ErrorAction SilentlyContinue
          cargo tauri signer sign --app-version $env:APP_VERSION $installer
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri signer sign failed" }
          if (-not (Test-Path -LiteralPath $sigPath)) { throw "Updater signature was not written to $sigPath" }

      - name: Upload release artifacts to R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $notes = Get-Content -Raw -LiteralPath $env:RELEASE_NOTES_PATH
          $bundleDir = "desktop\src-tauri\target\release\bundle\nsis"
          $installer = Get-ChildItem -LiteralPath $bundleDir -Filter "*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer .exe found in $bundleDir"
          }

          $tag = "${{ env.RELEASE_TAG }}"
          $objectKey = "${{ env.R2_PREFIX }}/$($installer.Name)"
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          $latestPath = Join-Path $env:RUNNER_TEMP "centsmith-latest.json"
          $releasePath = Join-Path $env:RUNNER_TEMP "centsmith-release.json"
          $existingReleasesPath = Join-Path $env:RUNNER_TEMP "centsmith-releases-existing.json"
          $mergedReleasesPath = Join-Path $env:RUNNER_TEMP "centsmith-releases.json"

          function Invoke-Wrangler([string[]]$Arguments) {
            & npx --yes wrangler@latest @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "wrangler $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          $metadata = [ordered]@{
            release_tag = $tag
            object_key = $objectKey
            filename = $installer.Name
            size_bytes = $installer.Length
            sha256 = $sha256
            published_at = $publishedAt
            notes = $notes
          }

          $metadata | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $latestPath -Encoding utf8
          $metadata | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $releasePath -Encoding utf8

          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/$objectKey", "--file=$($installer.FullName)", "--content-type", "application/vnd.microsoft.portable-executable", "--remote")
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/latest.json", "--file=$latestPath", "--content-type", "application/json", "--remote")
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/releases/$tag.json", "--file=$releasePath", "--content-type", "application/json", "--remote")

          # --- Tauri updater manifest (the app's auto-update feed, served
          # publicly by the website). Distinct from latest.json, which feeds the
          # website download page. The `url` points at the website's public
          # download route.
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) {
            throw "Updater signature not found at $sigPath. Ensure createUpdaterArtifacts is enabled and TAURI_SIGNING_PRIVATE_KEY is set."
          }
          $signature = (Get-Content -Raw -LiteralPath $sigPath).Trim()
          $version = $tag.TrimStart('v')
          $updaterPath = Join-Path $env:RUNNER_TEMP "centsmith-updater.json"
          $updater = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $publishedAt
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "$($env:UPDATER_BASE_URL)/download/$($installer.Name)"
              }
            }
          }
          $updater | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $updaterPath -Encoding utf8
          # Fail the release if the manifest doesn't match the Tauri updater
          # schema — a malformed feed would brick auto-update for every install.
          & .\packaging\validate-release-artifacts.ps1 -UpdaterJsonPath $updaterPath
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/updater.json", "--file=$updaterPath", "--content-type", "application/json", "--remote")

          $releases = @()
          & npx --yes wrangler@latest r2 object get "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/releases.json" "--file=$existingReleasesPath" "--remote"
          if ($LASTEXITCODE -eq 0 -and (Test-Path $existingReleasesPath)) {
            $existing = Get-Content -Raw -LiteralPath $existingReleasesPath | ConvertFrom-Json
            if ($existing -is [array]) {
              $releases = @($existing)
            } elseif ($null -ne $existing) {
              $releases = @($existing)
            }
          }

          $releases = @($metadata) + @($releases | Where-Object { $_.release_tag -ne $tag })
          $trimmedReleases = @($releases | Select-Object -First 20)
          ConvertTo-Json -InputObject $trimmedReleases -Depth 8 -AsArray | Set-Content -LiteralPath $mergedReleasesPath -Encoding utf8
          Invoke-Wrangler @("r2", "object", "put", "${{ env.R2_BUCKET }}/${{ env.R2_PREFIX }}/releases.json", "--file=$mergedReleasesPath", "--content-type", "application/json", "--remote")

          # Hand the version + installer hash to the published-feed contract check.
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify published update feed serves this release (P5.3)
        shell: pwsh
        run: |
          # Prove the just-published public feed serves the new version and the
          # exact installer bytes.
          & .\packaging\update-contract-test.ps1 `
            -BaseUrl "${{ env.UPDATER_BASE_URL }}" `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedInstallerSha256 $env:INSTALLER_SHA256

      - name: Installer smoke test (install, launch, health probe, uninstall)
        shell: pwsh
        run: .\packaging\installer-smoke-test.ps1
